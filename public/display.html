<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>KARAOKE PRO - Display</title>
<style>html,body{margin:0;height:100%;background:#05060d;color:#fff;font-family:system-ui;overflow:hidden}
#v{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#bg{position:absolute;inset:0;background:radial-gradient(#1b2f7a,#05060d)}
#v[src]{z-index:1}.t,.c,.f{z-index:2}.t{position:absolute;left:3vw;top:3vh;font-size:2.4vw;text-shadow:0 0 12px #000}.c{position:absolute;left:0;right:0;bottom:22vh;text-align:center;padding:0 5vw}
#cur{font-size:5vw;font-weight:800;color:#ff0;text-shadow:0 0 20px #f0f,0 3px 6px #000}#nxt{font-size:3vw;opacity:.8;text-shadow:0 2px 4px #000}
.f{position:absolute;left:3vw;right:3vw;bottom:3vh;display:flex;justify-content:space-between;font-size:2vw;text-shadow:0 2px 6px #000}
#go{position:absolute;inset:0;display:grid;place-items:center;background:#000c;font-size:3vw;cursor:pointer;z-index:9}</style>
<div id=go>▶ Click to start display</div><div id=bg></div><video id=v playsinline></video>
<div class=t id=top>KARAOKE PRO</div><div class=c><div id=cur>Add a song from your phone</div><div id=nxt></div></div>
<div class=f><div id=now></div><div id=join></div></div>
<script src=/socket.io/socket.io.js></script><script>
const room=location.pathname.split('/').pop(),s=io();let st={},cid=null,el=0,last=0,lines=[];
join.textContent='Join: '+location.origin+'/remote/'+room;
go.onclick=()=>{go.remove();v.play().catch(()=>{})};
s.emit('join',room);
s.on('restart',()=>{el=0;v.currentTime=0});
s.on('state',n=>{st=n;v.volume=n.volume;const c=n.current;
 if(!c){cid=null;v.removeAttribute('src');v.load();cur.textContent='Add a song from your phone';nxt.textContent='';top.textContent='KARAOKE PRO';now.textContent='';return}
 if(c.id!==cid){cid=c.id;lines=c.song.lyrics||[];el=0;
  if(c.song.hasMedia)v.src='/media/'+c.song.code+'.mp4';else{v.removeAttribute('src');v.load()}}
 top.textContent=c.song.code+' · '+c.song.title+' — '+c.song.artist;now.textContent='NOW SINGING: '+c.singer;
 const q=n.queue[0];nxt.textContent=q?'NEXT: '+q.singer+' — '+q.song.title:'';
 if(c.song.hasMedia)n.playing?v.play().catch(()=>{}):v.pause()});
v.onended=()=>s.emit('ctl',{action:'ended'});
setInterval(()=>{const now2=performance.now(),dt=(now2-last)/1000;last=now2;if(!st.current)return;const c=st.current.song;let t;
 if(c.hasMedia)t=v.currentTime;else{if(st.playing)el+=dt;t=el;if(t>c.duration){el=0;return s.emit('ctl',{action:'ended'})}}
 const l=lines.find(x=>t>=x.start&&t<x.end);cur.textContent=l?l.text:'♪'},100);
</script>
